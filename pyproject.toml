[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nava"
version = "0.1.0"
description = "NAVA — Native Audio-Visual Alignment for Generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ERNIE Team, Baidu Inc." }]
keywords = ["text-to-video", "audio-video", "diffusion", "mmdit", "wan2.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]

# ----------------------------------------------------------------
# Core inference dependencies.
#
# IMPORTANT — install torch FIRST, matching your CUDA:
#   # CUDA 12.8 (Ada / Hopper / Blackwell):
#   pip install torch==2.8.* torchvision torchaudio --index-url \
#       https://download.pytorch.org/whl/cu128
#   # then:
#   pip install -e .
#
# torch / triton are NOT pinned here so they don't get re-resolved
# and clobber a working CUDA build.
# ----------------------------------------------------------------
dependencies = [
    "safetensors>=0.4.0",
    "huggingface_hub>=0.25.0",
    "transformers>=4.56.0",
    "diffusers>=0.35.2",
    "accelerate>=1.10.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.20",
    "numpy",
    "scipy",
    "einops>=0.8.0",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "packaging",
    "regex",
    "ftfy",
    "pillow>=10.0",
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    "pydub",
    "soundfile",
]

[project.optional-dependencies]
# Sequence parallel (only needed for --use_sp / multi-GPU runs).
sp = ["xfuser>=0.4.0"]

# vLLM batch prompt rewrite server (pe_src/).
rewrite = ["vllm>=0.6.0", "aiohttp>=3.9", "dashscope>=1.20"]

# Gradio interactive demo (gradio_demo/).
demo = ["gradio>=4.0"]

dev = ["pytest>=7"]

all = [
    "xfuser>=0.4.0",
    "vllm>=0.6.0",
    "aiohttp>=3.9",
    "dashscope>=1.20",
    "gradio>=4.0",
]

[project.urls]
Homepage = "https://github.com/ernie-research/NAVA"
Paper = "https://arxiv.org/abs/2605.30073"

# ----------------------------------------------------------------
# What ships in the wheel.
# pe_src/ and gradio_demo/ are run as scripts, not imported as
# packages, so we don't list them here — they remain on disk in the
# editable install and `python -m` / `bash scripts/...` still works.
# ----------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["nava_src*", "NAVA_FP8*", "comfyui_nava*"]
exclude = ["tests*", "*.tests*", "eval_results*", "params*", "data*"]

[tool.setuptools.package-data]
"nava_src" = ["**/*.json", "**/*.yaml", "**/*.yml"]
